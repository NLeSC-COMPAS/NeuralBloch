name: Test

on:
  push:
    branches: [main]
  pull_request:

# A new push to a pull request cancels the run of the push before it
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  pytest:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      # setup-uv has no major version tags, so pin the commit of a release.
      # Its cache keeps the torch wheels and their CUDA libraries (several
      # GB) until uv.lock or pyproject.toml changes.
      - uses: astral-sh/setup-uv@68559e99cc807c1eb7e9238fd43a15bba460eec2 # v10.3.3
      - run: uv sync --locked
      # Runs the unit and integration tests, not the tests with the markers
      # julia and gpu. These tests cannot import juliacall, so Julia is not
      # installed. Raise the coverage floor when the coverage goes up.
      - run: uv run pytest --cov --cov-fail-under=78

name: Test

on:
  push:
    branches: [main]
    # Only changes that can affect the tests trigger them.
    paths: &code
      - "src/**"
      - "tests/**"
      - "pyproject.toml"
      - "uv.lock"
      - ".python-version"
      - ".github/workflows/test.yml"
  pull_request:
    paths: *code

# A new push to a pull request cancels the run of the push before it
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  pytest:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        # 3.15 has no onnxruntime wheel yet
        python-version: ["3.12", "3.13", "3.14"]

    steps:
      - uses: actions/checkout@v7

      - uses: astral-sh/setup-uv@68559e99cc807c1eb7e9238fd43a15bba460eec2 # v10.3.3
        with:
          python-version: ${{ matrix.python-version }}

      - run: uv sync --locked

      - name: Unit tests
        run: uv run pytest tests/unit -ra --cov --cov-report=

      - name: Integration tests
        run: uv run pytest tests/integration -ra --cov --cov-append --cov-report=

      - name: Coverage
        run: |
          echo "Coverage: $(uv run coverage report --format=total)%"

name: CI

on:
  push:
    branches: [main]
  pull_request:

# A new push to a pull request cancels the run of the push before it
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  lint:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-python@v7
        with:
          python-version-file: .python-version
          cache: pip
          cache-dependency-path: pyproject.toml

      # ruff comes from the dev extra
      - id: install
        run: >-
          pip install -e ".[dev]"
          --extra-index-url https://download.pytorch.org/whl/cpu
        env:
          NEURALBLOCH_SKIP_JULIA: "1"

      - name: ruff check
        run: ruff check --output-format=github .

      - name: ruff format
        if: ${{ !cancelled() && steps.install.outcome == 'success' }}
        run: ruff format --check --diff .

  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-python@v7
        with:
          python-version-file: .python-version
          cache: pip
          cache-dependency-path: pyproject.toml

      - run: >-
          pip install -e ".[dev]"
          --extra-index-url https://download.pytorch.org/whl/cpu
        env:
          NEURALBLOCH_SKIP_JULIA: "1"

      # The unit and integration tests, not the tests with the markers julia
      # and gpu. Raise the coverage floor when the coverage goes up.
      - name: pytest
        run: pytest --cov --cov-fail-under=80

  # prek:
  #   runs-on: ubuntu-latest
  #   steps:
  #     - uses: actions/checkout@v7
  #     # Runs the other hooks of prek.toml (`prek run --all-files`). The job
  #     # lint runs the ruff hooks.
  #     - uses: j178/prek-action@v2

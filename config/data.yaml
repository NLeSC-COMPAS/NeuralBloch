# Training reads this file and saves a copy in the checkpoint. The tasks after
# training (export_onnx, build_engine, export_bundle, test_accuracy and
# test_inference) read the copy in the checkpoint. A change in this file has
# no effect on a trained model. To use the change, train again.

# Number of samples for dataset from which validation and test set will be generated
N_SAMPLES: 40000

# Derivative generation: "forward_sensitivity" (default) or "finite_difference".
DERIVATIVE_METHOD: "forward_sensitivity"

# FISP3D Sequence related settings
# RF train: flip angles and phases, one value per TR, both in degrees.
RF_ANGLE_FILE: "data/rf_data/rf_angle_list.txt"
RF_PHASE_FILE: "data/rf_data/rf_phase_list.txt"
TR_S: 0.00558
TE_S: 0.002745
TI_S: 0.01084
TW_S: 0.000
MAX_STATE: 64
REPETITIONS: 5
INVERSION_PREPULSE: true
WAIT_SPOILING: true
PY_UNDERSAMPLING_FACTOR: 1
DELTA_K_SPOIL_RAD_PER_M: 0.0

# Lower bounds and upper bounds of generated T1, T2, B1 samples
T1_lower: 0.1
T1_upper: 6.0

T2_lower: 0.01
T2_upper: 2.0

B1_lower: 0.5
B1_upper: 1.5

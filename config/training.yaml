# Number of training epochs
N_EPOCHS: 5000

# Number of samples used in each optimization step.
TRAIN_BATCH_SIZE: 1000

# Validation does not affect gradients, so use larger batches and run it less
# frequently. The first and final epochs are always validated.
VALIDATION_BATCH_SIZE: 5000
VALIDATE_EVERY: 10

# Compile the complete optimizer step on CUDA. The first training batch takes
# several seconds to compile; subsequent batches use a captured CUDA graph.
COMPILE_TRAIN_STEP: true

# Learning rate scheduler used during training
LR_SCHEDULER: "cosine"  # "plateau" or "cosine"

# Number of newly generated training samples per epoch.
# Data is generated online using the Julia Bloch simulation.
ONLINE_BATCH_SIZE: 250

# Frequency of online data regeneration.
# A new training dataset is generated every REGEN_EVERY epochs.
# A total of ONLINE_BATCH_SIZE*REGEN_EVERY samples are generated every REGEN_EVERY epochs
REGEN_EVERY: 100

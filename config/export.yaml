# Exported models will be saved on these locations: one ONNX model and one
# TensorRT engine per target (TARGETS in scripts/export_onnx.py), each a method of the model:
#   signal_and_derivatives  forward: the signal and its T1/T2 derivatives
#   signal                  forward_signal: the signal alone
#   coefficients            forward_coefficients: the signal's basis coefficients
# An engine computes every output of its model on each call, so a separate
# model per target lets a caller skip the work it does not need.
# signal_and_derivatives keeps the original file names, which MRSTAT.jl's
# bootstrap.sh copies.
TARGETS:
  signal_and_derivatives:
    ONNX_FILE_PATH: "outputs/model.onnx"
    ENGINE_FILE_PATH: "outputs/model.engine"
  signal:
    ONNX_FILE_PATH: "outputs/model_signal.onnx"
    ENGINE_FILE_PATH: "outputs/model_signal.engine"
  coefficients:
    ONNX_FILE_PATH: "outputs/model_coefficients.onnx"
    ENGINE_FILE_PATH: "outputs/model_coefficients.engine"

# ONNX opset version used for export
OPSET_VERSION: 18

# Export the model with FP16 precision (model inputs and outputs stay FP32).
# TensorRT engines inherit their precision from the ONNX model (TensorRT
# networks are strongly typed), so this yields an FP16 engine that trades a
# small accuracy cost for inference speed.
# Re-run both `export_onnx` and `build_engine` after changing this setting.
FP16: false

# Dynamic batch size profile of the TensorRT engines.
# Each engine accepts any batch size in [MIN_BATCH_SIZE, MAX_BATCH_SIZE]
# and its kernels are tuned for OPT_BATCH_SIZE
# (set to testing.INFER_BATCH_SIZE, the batch size used during inference).
MIN_BATCH_SIZE: 10000
OPT_BATCH_SIZE: 14400
MAX_BATCH_SIZE: 40000

# Number of samples used to verify exported models against PyTorch
N_VERIFY_SAMPLES: 14400

# The model bundle NeuralBloch.jl reads (run.py export_bundle): the ONNX models
# above, the RF tables and a generated card.toml describing them.
BUNDLE_DIR: "outputs/bundle"

# The model's name in NeuralBloch.jl and in its release tag,
# model-<MODEL_FAMILY>-v<MODEL_VERSION>. A family is one contract for callers:
# the sequence, its number of readouts and the basis rank, named
# <sequence><ntr>-rank<rank> (export_bundle checks the rank), with a qualifier
# before the version if two families would otherwise share a name
# (fisp600b-rank16). The version counts retrains and re-exports of the family,
# each a drop-in replacement for the one before.
MODEL_FAMILY: "fisp600-rank16"
MODEL_VERSION: 1

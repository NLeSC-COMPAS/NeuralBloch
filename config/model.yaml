# Number of input parameters to the surrogate model
# Input: [T1, T2, B1]
input_dim: 3

# How the T1/T2 derivatives are produced.
#   "separate": independent sub-networks predict the signal, dT1 and dT2.
#               Needs every key below, including the *_dT1 / *_dT2 ones.
#   "forward":  one signal network is differentiated by forward sensitivity, so
#               all three outputs share the signal decoder. Needs a smooth
#               activation (not "relu"); the *_dT1 / *_dT2 keys are ignored.
derivative_mode: "separate"

# Hidden-layer activation: "relu", "silu", "gelu", "tanh", or "softplus".
# "relu" is only valid when derivative_mode is "separate".
activation: "relu"

# --- Always required (signal network) ---

# Latent representation size of the signal.
# In "forward" mode this is the total basis rank shared by all outputs.
NB_signal: 16

# Number of neurons in each hidden layer.
hidden_size_signal: 64

# Number of fully connected layers.
num_layers_signal: 4

# --- Required only when derivative_mode is "separate" ---
# Ignored (may be removed) when derivative_mode is "forward".

# Latent representation size for each derivative.
NB_dT1: 32
NB_dT2: 32

# Number of neurons in each hidden layer.
hidden_size_dT1: 128
hidden_size_dT2: 128

# Number of fully connected layers.
num_layers_dT1: 6
num_layers_dT2: 6

[project]
name = "neuralbloch"
version = "0.1.0"
description = "Neural network surrogate model for Bloch simulations in MR-STAT"
readme = "README.md"
requires-python = ">=3.12"
dependencies = [
    "h5py>=3.16.0",
    "juliacall>=0.9.35",
    "numpy>=2.5.1",
    "onnx>=1.22.0",
    "onnxruntime>=1.29.0",
    "onnxscript>=0.7.1",
    "pyyaml>=6.0.3",
    "tensorboard>=2.21.0",
    "tensorrt>=11.2.1.2",
    "torch==2.13.0",
]

[tool.uv.sources]
torch = { index = "pytorch-cu126" }

[[tool.uv.index]]
name = "pytorch-cu126"
url = "https://download.pytorch.org/whl/cu126"
explicit = true

[dependency-groups]
dev = [
    "prek>=0.4.11",
    "pytest>=9",
    "ruff>=0.16.1",
    "ty>=0.0.66",
]

[tool.pytest]
testpaths = ["tests"]
# The tests import `scripts`, `src` and `data` from the repository root.
pythonpath = ["."]
addopts = ["-ra"]
strict = true

[tool.ruff]
line-length = 88
target-version = "py312"

[tool.ruff.lint]
select = [
    "D", # pydocstyle
    "E", # pycodestyle (error)
    "F", # Pyflakes
    "I", # isort
    "W", # pycodestyle (warning)
    "N", # pep8-naming
    "PT", # flake8-pytest-style
]

ignore = [
    "E501", # Line too long
    "D100", # Missing module docstring
    "D104", # Missing public package docstring
    "D105", # Missing docstring in magic method
    "D107", # Missing `__init__` docstring
    # MR-STAT notation (T1, T2, B1, dT1, dT2, NTR) and the juliacall `Main as jl`
    # alias are conventional in this domain and match data_generation.jl
    "N803", # Argument name should be lowercase
    "N806", # Variable in function should be lowercase
    "N813", # Camelcase imported as lowercase
    # The following list excludes rules irrelevant to the Google style
    "D203",
    "D204",
    "D213",
    "D215",
    "D400",
    "D401",
    "D404",
    "D406",
    "D407",
    "D408",
    "D409",
    "D413",
]

# Allow autofix for all enabled rules (when `--fix`) is provided.
fixable = ["A", "B", "C", "D", "E", "F", "I"]

# https://docs.astral.sh/ty/coming-from-mypy-or-pyright/#recommended-configuration
# To catch that there are no types or the types are badly written
extend-select = ["ANN", "PYI"]
preview = true

[tool.ruff.lint.per-file-ignores]
# Ignore docstrings in all test files
"tests/**/*.py" = ["D"]

[tool.ruff.lint.isort]
force-single-line = true
lines-after-imports = 2
no-lines-before = [
    "future",
    "standard-library",
    "third-party",
    "first-party",
    "local-folder",
]

[tool.ruff.lint.pydocstyle]
convention = "google"

## Ty to catch that the types are wrong
[tool.ty.environment]
python-version = "3.12"

[tool.ty.src]
include = ["run.py", "src", "data", "scripts"]

[tool.ty.rules]
missing-type-argument = "error"
possibly-unresolved-reference = "warn"

[tool.ty.analysis]
# `juliacall.Main` is a live handle on the Julia runtime, populated at import
# time, so there is no static definition for it to resolve.
# `tensorrt` re-exports the compiled `tensorrt_bindings` package at import
# time, so its members cannot be resolved statically either.
replace-imports-with-any = ["juliacall", "tensorrt"]
